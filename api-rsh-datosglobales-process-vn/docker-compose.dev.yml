services:
    process-app:
        container_name: rsh-process-app
        build:
            context: .
            dockerfile: Dockerfile.dev
        networks:
          - rsh-net
        env_file:
            - .env
        environment:
            - APP_ENV=local
            - VIRTUAL_HOST=api-rsh-datosglobales-process.local.com   # <-- el dominio que ya tienes en tu hosts file
            - VIRTUAL_PORT=80
            - PHP_IDE_CONFIG=serverName=process
        volumes:
            - ./:/var/www/html/site
            - ./.env:/var/www/html/site/.env
            - ./docker/xdebug.ini:/usr/local/etc/php/conf.d/xdebug.ini
            - ./docker/opcache-dev.ini:/usr/local/etc/php/conf.d/zzz-opcache-dev.ini
        extra_hosts:
          - "api-rsh-datosglobalesexport-system.local.com:host-gateway"
          - "api-rsh-datosglobalestx-system.local.com:host-gateway"
          - "api-rsh-datosglobales-process.local.com:host-gateway"
networks:
  rsh-net:
    external: true
